services:
  unisic:
    build: .
    environment:
      UNISIC_SETUP_KEY: ${UNISIC_SETUP_KEY:?Configurare_UNISIC_SETUP_KEY}
    ports:
      - "127.0.0.1:58235:58235"
    volumes:
      - andrew_data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  andrew_data:
